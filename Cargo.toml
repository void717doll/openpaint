[package]
name = "openpaint"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "a native raster image editor"
license = "MIT"
default-run = "openpaint"

[dependencies]
macroquad = "=0.4.16"
image = { version = "=0.24.9", default-features = false, features = ["png", "bmp", "tga", "ico", "pnm", "webp", "dds"] }
serde_json = "1.0"
flate2 = "1.1"
fontdue = "0.9"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
