name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    name: package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            executable: openpaint
            rustflags: ""
          - runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            arch: x86_64
            executable: openpaint.exe
            rustflags: "-C target-feature=+crt-static"
          - runner: macos-15
            platform: macos
            target: aarch64-apple-darwin
            arch: arm64
            executable: openpaint
            rustflags: ""
          - runner: macos-15-intel
            platform: macos
            target: x86_64-apple-darwin
            arch: x86_64
            executable: openpaint
            rustflags: ""
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify release version
        run: python scripts/release.py verify-tag "$RELEASE_TAG"
      - name: install rust tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "${{ matrix.target }}"
      - name: install linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm appstream desktop-file-utils libx11-6 libxi6 libxkbcommon0 libgl1 libegl1
      - name: install windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: build
        run: cargo +stable build --locked --release --target "${{ matrix.target }}"
      - name: verify native execution
        run: '"target/${{ matrix.target }}/release/${{ matrix.executable }}" --version'
      - name: package linux
        if: runner.os == 'Linux'
        run: python scripts/package.py linux --binary "target/${{ matrix.target }}/release/openpaint"
      - name: package windows
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/package.py windows --binary "target/${{ matrix.target }}/release/openpaint.exe"
      - name: package macos
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/package.py macos --arch "${{ matrix.arch }}" --binary "target/${{ matrix.target }}/release/openpaint"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [checks, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: verify all packages and write checksums
        run: |
          python scripts/release.py verify-tag "$RELEASE_TAG"
          python scripts/release.py checksums dist --complete
      - name: prepare release notes
        shell: python
        run: |
          import os
          from pathlib import Path
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          Path("target").mkdir(exist_ok=True)
          Path("target/release-notes.md").write_text(
              f"openpaint {tag}\n\n"
              "linux: deb, rpm, and appimage for x86_64.\n\n"
              "windows: x86_64 installer and portable zip.\n\n"
              "macos: separate apple silicon and intel disk images.\n\n"
              "packages marked unsigned have no publisher certificate; macos unsigned bundles use an ad-hoc signature.\n\n"
              f"[features and known gaps](https://github.com/{repository}/blob/{tag}/docs/parity.md) · "
              f"[installation and checksums](https://github.com/{repository}/blob/{tag}/docs/releases.md)\n",
              encoding="utf-8",
          )
      - name: upload and publish complete release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo "refusing to replace an existing published release"; exit 1; }
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file target/release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "openpaint $RELEASE_TAG" --notes-file target/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false
